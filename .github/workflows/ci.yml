name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun run test
      # 压力跑：连打整场查规则边角（进贡重复牌那类问题就是这么抓出来的）
      - run: bun run scripts/soak-matches.ts 40
      - run: bun run build
